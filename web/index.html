<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiskDataKit — 文件管理</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 背景装饰层：网格光斑 -->
    <div class="bg-decor" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="grid-overlay"></div>
    </div>

    <header class="app-header">
        <div class="header-inner">
            <a class="brand" href="#" onclick="loadPath('');return false;">
                <img class="brand-logo" src="favicon.ico" width="22" height="22" alt="DiskDataKit" aria-hidden="true">
                <span class="brand-name" data-text="DiskDataKit">DiskDataKit</span>
                <span class="brand-dot"></span>
            </a>
            <div class="header-actions">
                <button id="pickBtn" class="btn btn-accent" title="打开系统文件夹选择器">
                    <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M1.75 1A1.75 1.75 0 0 0 0 2.75v10.5C0 14.216.784 15 1.75 15h12.5A1.75 1.75 0 0 0 16 13.25v-8.5A1.75 1.75 0 0 0 14.25 3H7.5L6 1.75A1.75 1.75 0 0 0 4.75 1h-3Z"></path></svg>
                    <span class="btn-label">选择文件夹</span>
                </button>
                <select id="driveSelect" class="select" title="选择磁盘或最近访问"></select>
                <button id="upBtn" class="btn btn-ghost" title="返回上一级">
                    <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M3.22 10.53a.75.75 0 0 1 0-1.06L7.47 5.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 1 1-1.06 1.06L8 6.8l-3.72 3.72a.75.75 0 0 1-1.06 0Z"></path></svg>
                    <span class="btn-label">上级</span>
                </button>
                <button id="refreshBtn" class="btn btn-ghost" title="刷新">
                    <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M1.705 8.005a.75.75 0 0 1 .834.656 5.5 5.5 0 0 0 9.592 2.97l-1.204-1.204a.25.25 0 0 1 .177-.427h3.011a.25.25 0 0 1 .25.25v3.011a.25.25 0 0 1-.427.177l-1.38-1.38A7 7 0 0 1 1.05 8.84a.75.75 0 0 1 .656-.834ZM8 2.5a5.49 5.49 0 0 0-4.388 2.196l1.204 1.204a.25.25 0 0 1-.177.427H1.628a.25.25 0 0 1-.25-.25V2.066a.25.25 0 0 1 .427-.177l1.38 1.38A7 7 0 0 1 14.95 7.16a.75.75 0 0 1-1.49.178A5.5 5.5 0 0 0 8 2.5Z"></path></svg>
                    <span class="btn-label">刷新</span>
                </button>
                <button id="chatToggleHeaderBtn" class="btn btn-ghost" title="AI 助手">
                    <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0ZM4.5 7a1 1 0 1 1 2 0 1 1 0 0 1-2 0Zm5 0a1 1 0 1 1 2 0 1 1 0 0 1-2 0Zm-1.5 4.5a3 3 0 0 1-2.5-1.34.5.5 0 0 1 .83-.55A2 2 0 0 0 8 10a2 2 0 0 0 1.67-.89.5.5 0 1 1 .83.55 3 3 0 0 1-2.5 1.34Z"/></svg>
                    <span class="btn-label">AI</span>
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="card glass breadcrumb-card">
            <nav class="breadcrumb" id="breadcrumb" aria-label="路径导航"></nav>
        </section>

        <section id="chartCard" class="card glass chart-card hidden">
            <div class="card-header">
                <div class="title-group">
                    <span class="title-accent"></span>
                    <h2 class="card-title">大小分布 · 帕累托图</h2>
                    <div id="chartHint" class="chart-hint hidden"></div>
                </div>
                <div class="chart-legend">
                    <label class="legend-toggle" data-line="self">
                        <input type="checkbox" id="toggleSelf" checked>
                        <span class="legend-line legend-line-self"></span>
                        <span class="legend-text">自身占比</span>
                    </label>
                    <label class="legend-toggle" data-line="cumulative">
                        <input type="checkbox" id="toggleCumulative" checked>
                        <span class="legend-line"></span>
                        <span class="legend-text">累计百分比</span>
                    </label>
                </div>
                <div class="card-header-line"></div>
            </div>
            <div class="chart-wrap">
                <canvas id="paretoCanvas"></canvas>
                <div id="chartTooltip" class="chart-tooltip hidden"></div>
            </div>
            <div id="expandSection" class="expand-section hidden">
                <div class="expand-header">
                    <span class="expand-title">展开详情 · <span id="expandLabel">其他</span></span>
                    <div class="expand-actions">
                        <button id="expandMore" class="btn-expand-more hidden">展开剩余 <span id="remainCount">0</span> 项</button>
                        <button id="expandClose" class="expand-close" title="关闭展开">×</button>
                    </div>
                </div>
                <div class="chart-wrap">
                    <canvas id="expandCanvas"></canvas>
                    <div id="expandTooltip" class="chart-tooltip hidden"></div>
                </div>
            </div>
        </section>

        <!-- 展开项数输入弹框 -->
        <div id="expandModal" class="modal-overlay hidden">
            <div class="modal-box">
                <div class="modal-title">展开"其他"项</div>
                <p class="modal-desc">输入要展开的条目数量（当前合并的尾部项目）</p>
                <input type="number" id="expandInput" class="modal-input" min="1" max="500" value="50">
                <div class="modal-actions">
                    <button id="expandCancel" class="btn btn-ghost">取消</button>
                    <button id="expandConfirm" class="btn btn-accent">展开</button>
                </div>
            </div>
        </div>

        <!-- 右键/左键上下文菜单 -->
        <div id="ctxMenu" class="ctx-menu hidden">
            <button id="ctxOpenExplorer" class="ctx-item">
                <svg class="ctx-icon" viewBox="0 0 16 16" width="14" height="14" fill="currentColor">
                    <path d="M1.5 3a1 1 0 0 1 1-1h4.379a1 1 0 0 1 .707.293L8.707 3.5H13.5a1 1 0 0 1 1 1V7h-1V4.5H8.5l-1-1H2.5v8H6v1H1.5V3z"/>
                    <path d="M8 8.5a.5.5 0 0 1 .5-.5h6a.5.5 0 0 1 .5.5v5a.5.5 0 0 1-.5.5h-6a.5.5 0 0 1-.5-.5v-5zM9 9v4h5V9H9z"/>
                </svg>
                打开文件夹所在位置
            </button>
        </div>

        <section class="card glass file-card">
            <div class="card-header">
                <div class="title-group">
                    <span class="title-accent"></span>
                    <h2 class="card-title">文件列表</h2>
                    <div id="countBadge" class="count-badge hidden"></div>
                    <div id="totalSizeBadge" class="size-badge hidden"></div>
                </div>
                <div class="card-header-line"></div>
            </div>

            <div id="status" class="status hidden"></div>

            <div class="table-wrap">
                <table class="file-table">
                    <thead>
                        <tr>
                            <th class="col-name">名称</th>
                            <th class="col-size">大小</th>
                            <th class="col-date">修改时间</th>
                        </tr>
                    </thead>
                    <tbody id="fileList"></tbody>
                </table>
                <div id="skeleton" class="skeleton hidden">
                    <div class="skeleton-row"></div>
                    <div class="skeleton-row"></div>
                    <div class="skeleton-row"></div>
                    <div class="skeleton-row"></div>
                    <div class="skeleton-row"></div>
                    <div class="skeleton-row"></div>
                </div>
                <div id="empty" class="empty hidden">
                    <div class="empty-icon">📂</div>
                    <p>此文件夹为空</p>
                </div>
            </div>
        </section>

        <footer class="app-footer">
            <span id="footerInfo"></span>
        </footer>
    </main>

    <!-- AI 助手侧边栏（VSCode 风格） -->
    <aside id="chatSidebar" class="chat-sidebar">
        <div class="chat-sidebar-header">
            <div class="chat-sidebar-title">
                <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" style="color:#c084fc"><path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0ZM4.5 7a1 1 0 1 1 2 0 1 1 0 0 1-2 0Zm5 0a1 1 0 1 1 2 0 1 1 0 0 1-2 0Zm-1.5 4.5a3 3 0 0 1-2.5-1.34.5.5 0 0 1 .83-.55A2 2 0 0 0 8 10a2 2 0 0 0 1.67-.89.5.5 0 1 1 .83.55 3 3 0 0 1-2.5 1.34Z"/></svg>
                <span>AI 助手</span>
                <div id="chatStatus" class="chat-status">DeepSeek</div>
            </div>
            <div class="chat-sidebar-actions">
                <button id="chatNewBtn" class="chat-icon-btn" title="新对话">
                    <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M3.25 7a.75.75 0 0 1 .75.75v3.5a.25.25 0 0 0 .25.25h7.5a.25.25 0 0 0 .25-.25v-3.5a.75.75 0 0 1 1.5 0v3.5A1.75 1.75 0 0 1 11.75 13h-7.5A1.75 1.75 0 0 1 2.5 11.25v-3.5A.75.75 0 0 1 3.25 7Zm4.5-5a.75.75 0 0 1 .75.75v5.19l1.72-1.72a.749.749 0 0 1 1.275.326.749.749 0 0 1-.215.734l-3 3a.75.75 0 0 1-1.06 0l-3-3a.749.749 0 0 1 .326-1.275.749.749 0 0 1 .734.215L7.5 7.94V2.75A.75.75 0 0 1 8.25 2Z"/></svg>
                </button>
                <button id="chatCloseBtn" class="chat-icon-btn" title="关闭面板">
                    <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.749.749 0 0 1 1.275.326.749.749 0 0 1-.215.734L9.06 8l3.22 3.22a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215L8 9.06l-3.22 3.22a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z"/></svg>
                </button>
            </div>
        </div>
        <div id="chatMessages" class="chat-messages">
            <div class="chat-welcome">
                <div class="chat-welcome-icon">🤖</div>
                <p>你好！我是 AI 助手</p>
                <p class="chat-welcome-hint">基于 DeepSeek 大模型，支持上下文记忆</p>
            </div>
        </div>
        <div class="chat-input-area">
            <div class="chat-input-wrap">
                <textarea id="chatInput" class="chat-input" placeholder="问点什么... (Enter 发送, Shift+Enter 换行)" rows="1"></textarea>
                <button id="chatSendBtn" class="chat-send-btn" title="发送">
                    <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M.989 8 .064 2.68a1.342 1.342 0 0 1 1.85-1.462l13.402 5.744a1.129 1.129 0 0 1 0 2.076L1.913 14.782a1.343 1.343 0 0 1-1.85-1.463L.99 8Zm.603-5.288L2.38 7.25h4.87a.75.75 0 0 1 0 1.5H2.38l-.788 4.538L13.929 8 1.592 2.712Z"/></svg>
                </button>
            </div>
            <div class="chat-input-hint">
                <select id="chatProviderSelect" class="chat-provider-select" title="切换模型">
                </select>
            </div>
        </div>
    </aside>
    <script src="app.js"></script>
    <script src="chat.js"></script>
</body>
</html>
